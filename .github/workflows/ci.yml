name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supply-chain baseline (homelab-governance, 2026-10-20): every action pinned to a full commit SHA with its tag as a
# comment, checkouts keep no token. The workflow grants nothing; each job asks for exactly what it needs.
permissions: {}
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true } # a newer push supersedes a running check

jobs:
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: get_mid_url.sh tests
        run: tests/get_mid_url_test.sh
      - name: check_dockerfile.sh tests
        run: tests/check_dockerfile_test.sh

  dockerfile:
    # BuildKit's build checks on the Dockerfile, without building it: no RUN step executes, so neither a ServiceNow
    # instance nor the MID installer download is involved. The checks frontend is pinned by digest in the script, which
    # accepts only the three known findings it lists.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build --call=check
        run: scripts/check_dockerfile.sh

  zizmor:
    # security audit of the workflows and dependabot.yml (config: .github/zizmor.yml). The action runs zizmor's container
    # image by version and digest (its support/versions list); results go to the log, not to code scanning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
